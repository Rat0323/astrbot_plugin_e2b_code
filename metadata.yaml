name: astrbot_plugin_e2b_code
desc: ☁️ E2B Code Runner - 基于 E2B 云端沙箱的 Python 代码执行指令插件
help: |
  ☁️ E2B 云端代码运行器指令版 (v1.0)
  
  【使用格式】
  /code [Python代码]
  或换行输入：
  /code
  [Python代码]
  
  【使用帮助指令】
  /ecode
  
  【特点】
  1. 100% 云端沙箱隔离，绝不影响宿主机安全！
  2. 自动捕获绘图结果（Matplotlib/Seaborn 等）并以图片形式发送回群聊。
  3. 支持常见的科学计算与联网操作。
version: "1.0"
author: Rat
repo: https://github.com/Rat0323/astrbot_plugin_e2b_code
